spring:
  application:
    name: ledger-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ledger}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger-dev}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  servlet:
    multipart:
      # 单张图片（头像 / 反馈）的硬上限，超出直接 413
      max-file-size: 2MB
      # 反馈一次最多带 3 张图，整包放宽到 10MB
      max-request-size: 10MB

server:
  # 8080 落在 Windows/Hyper-V 的 TCP 保留段（8006-8105）内，本机无法绑定，故用 9090
  port: ${SERVER_PORT:9090}

app:
  jwt:
    # 仅本地开发用的默认值，生产环境必须通过 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:dev-only-ledger-jwt-secret-key-please-override-in-prod-0123456789}
    ttl: P7D
    issuer: ledger-app
  cors:
    # 逗号分隔的来源列表。默认只放行本机，走 nginx 同源反代的预览不会碰 CORS；
    # 队友用别的域名/端口打开页面时，用环境变量补上，例如
    # CORS_ALLOWED_ORIGIN_PATTERNS=http://localhost:[*],http://127.0.0.1:[*],http://10.55.253.214:[*]
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}"
  storage:
    # 头像落盘目录，相对后端启动目录；容器化部署时挂到持久卷上
    avatar-dir: ${AVATAR_DIR:data/avatars}
    # 反馈图片落盘目录，同上
    feedback-dir: ${FEEDBACK_DIR:data/feedback}

logging:
  level:
    com.example.ledger: INFO
