services:
  mysql:
    image: mysql:8.4
    container_name: ledger-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ledger-root
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger-dev
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pledger-root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
    # 沿用目录迁移前（compose 项目名 backend）创建的数据卷，换目录不丢数据。
    # 想要干净命名时，把数据拷到新卷后再改这一行即可。
    name: backend_mysql-data
